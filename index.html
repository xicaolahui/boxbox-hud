<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOX BOX Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf0e8;
        color: #084090;
        font-family: Barlow, sans-serif;
      }
      main {
        width: min(520px, calc(100% - 40px));
        padding: 36px 32px;
        border: 1px solid rgba(8, 64, 144, 0.12);
        border-radius: 14px;
        background: #fff;
      }
      h1 {
        margin: 0 0 8px;
        font-family: "Playfair Display", serif;
        font-size: 42px;
      }
      p {
        margin: 0 0 24px;
        color: #2a4f8c;
        line-height: 1.5;
      }
      a {
        display: block;
        margin-top: 10px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #084090;
        color: #fff;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      a.ghost {
        background: transparent;
        border: 1px solid #084090;
        color: #084090;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BOX BOX</h1>
      <p>Open the live prototype: dashboard with 3D driver, or the telemetry HUD.</p>
      <a href="dashboard.html">Open Dashboard</a>
      <a class="ghost" href="telemetry.html">Open Telemetry</a>
    </main>
  </body>
</html>
